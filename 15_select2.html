                  </div>

                <div class="col-md-3">
                  <label for="validationCustom04" class="form-label">State</label>
                  <select class="form-select" id="validationCustom04" required>

                  <div class="invalid-feedback">
                    Please select a valid state.

                </div>
                <div class="col-md-3">

                  <div class="invalid-feedback">
            alamat

                <div class="col-md-4">
                    <label for="nama" class="form-label" >Perawat PPA</label>
                    <select name="nama" id="nama" class="js-example-templating" style="width: 500px" onchange="nameChange(this)" required>
                        <!-- <option selected disabled value=""></option> -->
                    </select>
                    <div class="invalid-feedback">
                        Harus di isi
                    </div>
                </div>
<script>
  $(document).ready(function() {
    $('#nama').select2({
        ajax: {
            url: 'json_db_tindakan.php',
            type: 'GET',
            dataType: 'json',
            delay: 250,
            data: function(params) {
                return {
                    q: params.term // search term
                };
            },
            processResults: function(data) {
                return {
                    results: data
                };
            },
            cache: true
        },
        placeholder: 'Pilih jenis tindakan',
        minimumInputLength: 2
    });
  });

  function nameChange(selectElement) {

      var getID = $(selectElement).select2('data'); // Get the selected ID and text using select2('data')
      document.getElementById('zip').value = getID[0]['id']; // That's the selected ID :)
      document.getElementById('nama_depan').value = getID[0]['text']; // That's the selected ID :)
      document.getElementById('kodepos').value = getID[0]['category']; // That's the selected ID :)
      document.getElementById('alamat').value = getID[0]['alamat']; // That's the selected ID :)
      document.getElementById('username').value = getID[0]['kode']; // That's the selected ID :)

  }
</script>

    <script>
        // Example starter JavaScript for disabling form submissions if there are invalid fields
        (function() {
            'use strict'

            // Fetch all the forms we want to apply custom Bootstrap validation styles to
            var forms = document.querySelectorAll('.harus-validasi')

            // Loop over them and prevent submission
            Array.prototype.slice.call(forms)
                .forEach(function(form) {
                    form.addEventListener('submit', function(event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }

                        form.classList.add('was-validated')
                    }, false)
                })
        })()
    </script>
