            <form class="row g-3 harus-validasi" novalidate>
                
                <div class="col-md-4">

                  <input type="text" class="form-control" id="validationCustom01"  required>

                <div class="col-md-4">

                    Looks good!

                </div>
                <div class="col-md-4">
                  <label for="validationCustomUsername" class="form-label">Username</label>
                  <div class="input-group has-validation">
                    <span class="input-group-text" id="inputGroupPrepend">@</span>
                    <input type="text" class="form-control" id="validationCustomUsername" aria-describedby="inputGroupPrepend" required>
                    <div class="invalid-feedback">
                      Please choose a username.
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <label for="validationCustom03" class="form-label">City</label>
                  <input type="text" class="form-control" id="validationCustom03" required>
                  <div class="invalid-feedback">
                    Please provide a valid city.
                  </div>
                </div>
                <div class="col-md-3">
                  <label for="validationCustom04" class="form-label">State</label>
                  <select class="form-select" id="validationCustom04" required>
                    <option selected disabled value="">Choose...</option>
                    <option value="malang">Malang</option>
                  </select>
                  <div class="invalid-feedback">
                    Please select a valid state.
                  </div>
                </div>
                <div class="col-md-3">

                  <input type="text" class="form-control" id="validationCustom05" required>

                </div>
                <div class="col-md-3">

                    <input type="text" class="form-control" id="kota" required>
                    <div class="invalid-feedback">

                    </div>
                  </div>
                  <div class="col-md-3">
                    <label for="kota" class="form-label">kode pos</label>
                    <input type="text" class="form-control" id="kota" required>
                    <div class="invalid-feedback">
                      kode harus di isi
                    </div>
                  </div>
                <div class="col-md-4">
                    <label for="nama" class="form-label" >Perawat PPA</label>
                    <select name="nama" id="nama" class="js-example-templating" style="width: 500px" required>
                        <option selected disabled value="">pilih nama </option>
                    </select>
                    <div class="invalid-feedback">
                        Harus di isi
                    </div>
                </div>
<script>
  $(document).ready(function() {

      $('#nama').select2({
          width: '100%',
          placeholder: 'Ketik nama petugas...',
          minimumInputLength: 2,
          ajax: {
              url: 'http://localhost/training/json_demo.txt',
              dataType: 'json',
              delay: 300,
              data: function (params) {
                  return { q: params.term };
              },
              processResults: function (data) {
                  return {
                      results: data
                  };
              }
          }
      });

</script>

    </div>
    <script>
        // Example starter JavaScript for disabling form submissions if there are invalid fields
        (function() {
            'use strict'

            // Fetch all the forms we want to apply custom Bootstrap validation styles to
            var forms = document.querySelectorAll('.harus-validasi')

            // Loop over them and prevent submission
            Array.prototype.slice.call(forms)
                .forEach(function(form) {
                    form.addEventListener('submit', function(event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }

                        form.classList.add('was-validated')
                    }, false)
                })
        })()
    </script>
